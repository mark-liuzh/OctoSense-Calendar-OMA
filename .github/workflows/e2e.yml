name: e2e-linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: Linux E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout OctoSense Calendar
        uses: actions/checkout@v4
        with:
          repository: mark-liuzh/OctoSense-Calendar-OMA
          path: OctoSense-Calendar-OMA

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install apt dependencies
        # v6 fix: 涔嬪墠 v3-v5 閮芥槸鍥犱负 runs-on 鍩嬪湪娉ㄩ噴閲屽鑷?GitHub 鎶ョ己 run-on
        # 鏈鍏?add universe 鍐嶈鍖?        run: |
          sudo apt-get update -qq
          sudo add-apt-repository -y universe
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential pkg-config \
            libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libxkbcommon-dev libssl-dev \
            libudev-dev libpulse-dev curl python3 git ca-certificates \
            libfontconfig1-dev libfreetype6-dev libdbus-1-dev \
            libxcursor-dev libdrm-dev \
            libasound2-dev || sudo apt-get install -y -qq libasound-dev

      - name: Prepare launcher workspace
        run: |
          mkdir -p launcher
          cd launcher
          git clone --depth 1 https://github.com/OctoSense-org/OctoSense-App-Hub.git
          git clone --depth 1 https://github.com/OctoSense-org/makepad.git
          git clone --depth 1 https://github.com/OctoSense-org/Octoscript-Makepad.git octoscript-makepad
          git clone --depth 1 https://github.com/OctoSense-org/OctoScript.git octoscript
          for p in makepad/widgets octoscript-makepad/crates/octoscript-makepad octoscript/crates/octoscript-ui-l0; do
            if [ -e "OctoSense-App-Hub/../$p" ]; then echo "OK $p"; else echo "MISSING $p"; fi
          done

      - name: Build card-host and hub
        working-directory: launcher/OctoSense-App-Hub
        run: |
          cargo build --release -p octosense-card-host -p octosense-app-hub
          for bin in card-host hub; do
            if [ ! -x "target/release/$bin" ]; then
              echo "FATAL: target/release/$bin missing"
              exit 1
            fi
            sz=$(stat -c%s "target/release/$bin")
            echo "OK $bin: ${sz} bytes"
            [ "$sz" -gt 100000 ] || { echo "FATAL: $bin too small"; exit 1; }
          done

      - name: Run static gates
        working-directory: OctoSense-Calendar-OMA
        env:
          OCTO_CARD_HOST: ${{ github.workspace }}/launcher/OctoSense-App-Hub/target/release/card-host
          OCTO_HUB: ${{ github.workspace }}/launcher/OctoSense-App-Hub/target/release/hub
        run: bash tools/run_all.sh --fast

      - name: Run full E2E suite
        working-directory: OctoSense-Calendar-OMA
        env:
          OCTO_CARD_HOST: ${{ github.workspace }}/launcher/OctoSense-App-Hub/target/release/card-host
          OCTO_HUB: ${{ github.workspace }}/launcher/OctoSense-App-Hub/target/release/hub
        run: bash tools/run_all.sh

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: octosense-screenshots
          path: OctoSense-Calendar-OMA/bundle/screenshots/
          if-no-files-found: ignore

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: octosense-runlog
          path: OctoSense-Calendar-OMA/.runtime/
          if-no-files-found: ignore
